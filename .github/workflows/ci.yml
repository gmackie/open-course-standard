name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Docs and generated schemas
        run: pnpm check:docs && pnpm check:schemas
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Schema validation of examples and fixtures
        run: pnpm check:example-schemas
      - name: Examples validate (ocs validate)
        run: pnpm check:examples
      - name: Conformance suite (reference implementation)
        run: pnpm conformance

  node20:
    name: runtime (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Library smoke test on Node 20
        run: node packages/ocs/scripts/smoke.mjs
      - name: Examples validate on Node 20
        run: node packages/ocs/dist/cli.js validate examples/level-neutral examples/educateos
      - name: Conformance suite on Node 20
        run: node conformance/run.mjs
