name: OCS conformance
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reference-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference tooling
        run: python -m pip install -e .
      - name: Unit and conformance tests
        run: python -m unittest discover -s tests -v
      - name: Validate every sample
        run: |
          ocs validate examples/minimal-course
          ocs validate examples/secondary-biology
          ocs validate examples/undergraduate-lab
          ocs validate examples/graduate-seminar
          ocs validate examples/federated-watershed
      - name: Verify locked sample
        run: ocs verify examples/federated-watershed
